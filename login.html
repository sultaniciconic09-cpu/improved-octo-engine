<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL — Login</title><link rel="stylesheet" href="assets/app.css"></head><body><div class="auth"><div class="auth-box panel"><a class="brand" href="index.html"><i class="brand-mark"></i>GLOBAL</a><h1 style="margin:22px 0 5px">Welcome back.</h1><p class="muted">Sign in to continue building with GLOBAL.</p><input id="email" placeholder="Email or username"><input id="password" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><p class="muted" style="text-align:center;margin-top:18px">New here? <a href="create-account.html" style="color:var(--cyan)">Create an account</a></p></div></div><script>function login(){fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('email').value,password:document.getElementById('password').value})}).then(r=>r.json()).then(d=>{if(d.success){localStorage.setItem('global_current_account',JSON.stringify(d.user||d.account));localStorage.setItem('global_logged_in','true');location.href='index.html'}else alert(d.error||'Login failed')}).catch(()=>alert('Server unavailable.'))}</script></body></html>
