<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>GLOBAL — Problems</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<script src="assets/app.js"></script>
<script>
GLOBAL.shell();
const app = document.getElementById('app');
const a = GLOBAL.account();

app.innerHTML = `
<div class="section-title">
  <div>
    <span class="eyebrow">PROBLEMS</span>
    <h1>Problems</h1>
    <p class="muted">Make problems visible so people can build solutions.</p>
  </div>
  <button class="btn primary" id="openCreate">Post a problem</button>
</div>

<div class="tabs panel" id="probTabs">
  <button class="tab active" data-filter="all">All</button>
  <button class="tab" data-filter="Nigeria">Nigeria</button>
  <button class="tab" data-filter="Africa">Africa</button>
  <button class="tab" data-filter="Technology">Technology</button>
  <button class="tab" data-filter="Education">Education</button>
  <button class="tab" data-filter="Energy">Energy</button>
  <button class="tab" data-filter="Health">Health</button>
</div>

<div id="createPanel" class="card panel" style="margin-top:14px;display:none">
  <h3 style="margin:0 0 12px">Post a problem</h3>
  <input id="probTitle" placeholder="Problem title" style="width:100%;margin-bottom:10px">
  <textarea id="probContent" placeholder="Describe the problem, who is affected, and current constraints..." rows="4" style="width:100%;margin-bottom:10px"></textarea>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <select id="probCategory">
      <option value="General">General</option>
      <option value="Technology">Technology</option>
      <option value="Education">Education</option>
      <option value="Energy">Energy</option>
      <option value="Health">Health</option>
      <option value="Agriculture">Agriculture</option>
      <option value="Transport">Transport</option>
      <option value="Climate">Climate</option>
    </select>
    <select id="probRegion">
      <option value="Global">Global</option>
      <option value="Nigeria">Nigeria</option>
      <option value="Africa">Africa</option>
      <option value="West Africa">West Africa</option>
      <option value="East Africa">East Africa</option>
    </select>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn primary" id="submitProb">Publish problem</button>
    <button class="btn" id="cancelCreate">Cancel</button>
    <span id="probStatus" class="muted"></span>
  </div>
</div>

<div id="probsList" class="card panel" style="margin-top:14px">
  <p class="muted" style="padding:20px;text-align:center">Loading problems…</p>
</div>
`;

GLOBAL.footer();

const $ = id => document.getElementById(id);
let currentFilter = 'all';

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString() + ' · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch { return ''; }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadProblems() {
  const list = $('probsList');
  list.innerHTML = '<p class="muted" style="padding:20px;text-align:center">Loading problems…</p>';
  try {
    const r = await fetch('/api/problems');
    const d = await r.json();
    let items = d.problems || [];
    if (currentFilter !== 'all') {
      items = items.filter(p => 
        (p.category || '') === currentFilter || 
        (p.region || '').toLowerCase().includes(currentFilter.toLowerCase())
      );
    }
    if (!items.length) {
      list.innerHTML = `<div style="padding:32px;text-align:center">
        <p class="muted">No problems posted yet.</p>
        <button class="btn primary" style="margin-top:12px" onclick="document.getElementById('openCreate').click()">Post the first one</button>
      </div>`;
      return;
    }
    list.innerHTML = '<div class="list">' + items.map(p => `
      <div class="list-item">
        <span class="badge">${escapeHtml(p.region || 'Global')}</span>
        <span class="badge" style="margin-left:6px">${escapeHtml(p.category || 'General')}</span>
        <h3 style="margin:8px 0 4px">${escapeHtml(p.title)}</h3>
        <p class="muted" style="margin:0 0 8px">${escapeHtml(p.content)}</p>
        <div class="muted" style="font-size:12px">
          ${escapeHtml(p.authorName || 'Anonymous')} · ${formatDate(p.createdAt)}
        </div>
      </div>
    `).join('') + '</div>';
  } catch (e) {
    list.innerHTML = '<p class="muted" style="padding:20px;text-align:center">Could not load problems.</p>';
  }
}

$('openCreate').onclick = () => {
  if (!a) return location.href = 'login.html';
  $('createPanel').style.display = 'block';
  $('probTitle').focus();
};
$('cancelCreate').onclick = () => { $('createPanel').style.display = 'none'; $('probStatus').textContent = ''; };
$('submitProb').onclick = async () => {
  const title = $('probTitle').value.trim();
  const content = $('probContent').value.trim();
  if (!title || !content) { $('probStatus').textContent = 'Title and description required.'; return; }
  $('submitProb').disabled = true;
  $('probStatus').textContent = 'Publishing…';
  try {
    const r = await fetch('/api/problems', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title, content,
        category: $('probCategory').value,
        region: $('probRegion').value,
        authorId: a.userId || a.id,
        authorName: a.fullName || a.username || 'Builder'
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    $('probTitle').value = ''; $('probContent').value = '';
    $('createPanel').style.display = 'none';
    loadProblems();
  } catch (e) {
    $('probStatus').textContent = 'Could not publish.';
  } finally {
    $('submitProb').disabled = false;
  }
};

$('probTabs').onclick = e => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  document.querySelectorAll('#probTabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  loadProblems();
};

loadProblems();
</script>
</body>
</html>
