<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b12">
<title>GLOBAL — Ideas</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<script src="assets/app.js"></script>
<script>
GLOBAL.shell();
const app = document.getElementById('app');
const a = GLOBAL.account();

app.innerHTML = `
<div class="section-title">
  <div>
    <span class="eyebrow">IDEAS</span>
    <h1>Ideas</h1>
    <p class="muted">Good ideas should be visible, discussable and buildable.</p>
  </div>
  <button class="btn primary" id="openCreate">Share an idea</button>
</div>

<div class="tabs panel" id="ideaTabs">
  <button class="tab active" data-filter="all">All</button>
  <button class="tab" data-filter="new">Newest</button>
  <button class="tab" data-filter="Technology">Technology</button>
  <button class="tab" data-filter="Education">Education</button>
  <button class="tab" data-filter="Energy">Energy</button>
  <button class="tab" data-filter="Health">Health</button>
</div>

<div id="createPanel" class="card panel" style="margin-top:14px;display:none">
  <h3 style="margin:0 0 12px">Share a new idea</h3>
  <input id="ideaTitle" placeholder="Idea title" style="width:100%;margin-bottom:10px">
  <textarea id="ideaContent" placeholder="Describe the idea, who it helps, and what you need..." rows="4" style="width:100%;margin-bottom:10px"></textarea>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    <select id="ideaCategory">
      <option value="General">General</option>
      <option value="Technology">Technology</option>
      <option value="Education">Education</option>
      <option value="Energy">Energy</option>
      <option value="Health">Health</option>
      <option value="Agriculture">Agriculture</option>
      <option value="Climate">Climate</option>
    </select>
    <input id="ideaHelp" placeholder="Help needed (comma separated, e.g. Developer, Funding)" style="flex:1;min-width:200px">
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn primary" id="submitIdea">Publish idea</button>
    <button class="btn" id="cancelCreate">Cancel</button>
    <span id="ideaStatus" class="muted"></span>
  </div>
</div>

<div id="ideasList" class="card panel" style="margin-top:14px">
  <p class="muted" style="padding:20px;text-align:center">Loading ideas…</p>
</div>
`;

GLOBAL.footer();

const $ = id => document.getElementById(id);
let currentFilter = 'all';

function formatDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString() + ' · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  } catch { return ''; }
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadIdeas() {
  const list = $('ideasList');
  list.innerHTML = '<p class="muted" style="padding:20px;text-align:center">Loading ideas…</p>';
  try {
    const r = await fetch('/api/ideas');
    const d = await r.json();
    let ideas = d.ideas || [];
    if (currentFilter === 'new') {
      ideas = ideas.slice().sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    } else if (currentFilter !== 'all') {
      ideas = ideas.filter(i => (i.category || '') === currentFilter);
    }
    if (!ideas.length) {
      list.innerHTML = `<div style="padding:32px;text-align:center">
        <p class="muted">No ideas yet.</p>
        <button class="btn primary" style="margin-top:12px" onclick="document.getElementById('openCreate').click()">Be the first to share one</button>
      </div>`;
      return;
    }
    list.innerHTML = '<div class="list">' + ideas.map(idea => `
      <div class="list-item">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <span class="badge">${escapeHtml(idea.category || 'General')}</span>
            <h3 style="margin:8px 0 4px">${escapeHtml(idea.title)}</h3>
            <p class="muted" style="margin:0 0 8px">${escapeHtml(idea.content)}</p>
            <div class="muted" style="font-size:12px">
              ${escapeHtml(idea.authorName || 'Anonymous')} · ${formatDate(idea.createdAt)}
              ${idea.helpNeeded && idea.helpNeeded.length ? ' · Looking for: ' + idea.helpNeeded.map(h => '<span class="tag">'+escapeHtml(h)+'</span>').join(' ') : ''}
            </div>
          </div>
        </div>
      </div>
    `).join('') + '</div>';
  } catch (e) {
    list.innerHTML = '<p class="muted" style="padding:20px;text-align:center">Could not load ideas. Is the server running?</p>';
  }
}

$('openCreate').onclick = () => {
  if (!a) return location.href = 'login.html';
  $('createPanel').style.display = 'block';
  $('ideaTitle').focus();
};
$('cancelCreate').onclick = () => {
  $('createPanel').style.display = 'none';
  $('ideaStatus').textContent = '';
};
$('submitIdea').onclick = async () => {
  const title = $('ideaTitle').value.trim();
  const content = $('ideaContent').value.trim();
  if (!title || !content) {
    $('ideaStatus').textContent = 'Title and description are required.';
    return;
  }
  $('submitIdea').disabled = true;
  $('ideaStatus').textContent = 'Publishing…';
  try {
    const help = $('ideaHelp').value.split(',').map(s => s.trim()).filter(Boolean);
    const r = await fetch('/api/ideas', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title, content,
        category: $('ideaCategory').value,
        authorId: a.userId || a.id,
        authorName: a.fullName || a.username || 'Builder',
        helpNeeded: help
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Failed');
    $('ideaTitle').value = '';
    $('ideaContent').value = '';
    $('ideaHelp').value = '';
    $('createPanel').style.display = 'none';
    $('ideaStatus').textContent = '';
    loadIdeas();
  } catch (e) {
    $('ideaStatus').textContent = 'Could not publish.';
  } finally {
    $('submitIdea').disabled = false;
  }
};

$('ideaTabs').onclick = e => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  document.querySelectorAll('#ideaTabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  loadIdeas();
};

loadIdeas();
</script>
</body>
</html>
