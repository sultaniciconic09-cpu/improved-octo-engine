<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLOBAL — Create account</title><link rel="stylesheet" href="assets/app.css"></head><body><div class="auth"><div class="auth-box panel"><a class="brand" href="index.html"><i class="brand-mark"></i>GLOBAL</a><h1 style="margin:22px 0 5px">Create your GLOBAL account.</h1><p class="muted">Join the network for ideas, problems, projects, research and opportunity.</p><input id="name" placeholder="Full name"><input id="username" placeholder="Username"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="register()">Create account</button><p class="muted" style="text-align:center;margin-top:18px">Already have an account? <a href="login.html" style="color:var(--cyan)">Sign in</a></p></div></div><script>function register(){const b={fullName:name.value,username:username.value,email:email.value,password:password.value};fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).then(d=>{if(d.success){localStorage.setItem('global_current_account',JSON.stringify(d.user||d.account));localStorage.setItem('global_logged_in','true');location.href='index.html'}else alert(d.error||'Could not create account')}).catch(()=>alert('Server unavailable.'))}</script></body></html>
